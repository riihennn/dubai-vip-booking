<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="limeGold" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4ff70"/>
      <stop offset="50%" stop-color="#b1ef42"/>
      <stop offset="100%" stop-color="#72c10c"/>
    </linearGradient>
    <linearGradient id="ringGlow" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="20" y="20" width="24" height="24" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="dotGlow" cx="32" cy="32" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4ff70"/>
      <stop offset="40%" stop-color="#b1ef42"/>
      <stop offset="100%" stop-color="#b1ef42" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#b1ef42" stroke-opacity="0.15" stroke-width="6"/>

  <!-- Primary Luxury Ring (Dubai VIP Brand Badge) -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#limeGold)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#ringGlow)" stroke-width="3.5"/>

  <!-- Inner Orbital Ring -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="#b1ef42" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Radiant Center Beacon Glow -->
  <circle cx="32" cy="32" r="9" fill="url(#dotGlow)"/>

  <!-- Central Solid Core -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3.5" fill="#b1ef42"/>
</svg>
